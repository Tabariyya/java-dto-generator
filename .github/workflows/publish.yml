name: Build and Publish

on:
  push:
    branches:
      - development
    paths:
      - '**/pom.xml'

jobs:
  build-and-publish:
    runs-on: self-hosted

    steps:
      - name: Checkout code (with LFS)
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Work out which modules are not on Maven Central yet
        id: modules
        run: |
          # Ask Central whether each module's exact GAV already exists, rather than diffing pom
          # versions against the previous commit. The reactor holds independently versioned modules,
          # so a release of one must not re-upload the others — Central rejects a version it already
          # has, which would fail the whole bundle. This also makes a re-run a no-op and copes with
          # poms that move in the tree without changing version.
          set -euo pipefail
          PUBLISH=""
          for dir in . java-dto-generator entity-id-generator; do
            COORDS=$(python3 .github/scripts/pom-coords.py "$dir/pom.xml")
            GROUP=$(echo "$COORDS" | cut -d' ' -f1 | tr '.' '/')
            ARTIFACT=$(echo "$COORDS" | cut -d' ' -f2)
            VERSION=$(echo "$COORDS" | cut -d' ' -f3)
            if curl -sfI -o /dev/null "https://repo1.maven.org/maven2/$GROUP/$ARTIFACT/$VERSION/"; then
              echo "$ARTIFACT:$VERSION is already on Central - skipping"
            else
              echo "$ARTIFACT:$VERSION is not on Central - will publish"
              PUBLISH="${PUBLISH:+$PUBLISH,}$dir"
            fi
          done
          echo "publishing: ${PUBLISH:-<nothing>}"
          echo "projects=$PUBLISH" >> $GITHUB_OUTPUT

      - name: Build and deploy via Docker
        if: steps.modules.outputs.projects != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
          PROJECTS: ${{ steps.modules.outputs.projects }}
        run: |
          # JDK 21, not 8: the entity id generator needs 17+. java-dto-generator still emits Java 8
          # bytecode, via maven.compiler.release rather than the build JDK.
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -e GPG_PRIVATE_KEY \
            -e GPG_PASSPHRASE \
            -e MAVEN_SETTINGS_XML \
            -e PROJECTS \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            maven:3.9-eclipse-temurin-21 \
            bash -c '
              apt-get update -q && apt-get install -y -q gnupg &&
              echo "$GPG_PRIVATE_KEY" | gpg --batch --import &&
              mkdir -p ~/.m2 && printf "%s" "$MAVEN_SETTINGS_XML" > ~/.m2/settings.xml &&
              mvn clean deploy -Prelease -pl "$PROJECTS" -Dgpg.passphrase="$GPG_PASSPHRASE"
              STATUS=$?
              chown -R "$HOST_UID:$HOST_GID" /app
              exit $STATUS
            '
